<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кругосвет</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0f1117;
    color:#cdd6f4; font-family: system-ui, -apple-system, sans-serif; user-select:none; }
  canvas { display:block; cursor: crosshair; }

  #hud { position:fixed; top:16px; left:16px; width:260px;
    display:flex; flex-direction:column; gap:8px; z-index:10; }
  .bar { height:20px; background:rgba(0,0,0,0.55); border-radius:12px;
    overflow:hidden; border:2px solid rgba(255,255,255,0.08); position:relative; }
  .bar-label { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:11px; font-weight:bold;
    text-shadow:0 1px 2px rgba(0,0,0,0.8); }
  #hpFill { height:100%; width:100%; background:linear-gradient(90deg,#f38ba8,#eba0ac); transition:width .15s; }
  #xpFill { height:100%; width:0%; background:linear-gradient(90deg,#a6e3a1,#94e2d5); transition:width .15s; }
  #levelRow { display:flex; justify-content:space-between; padding:0 4px; font-size:14px; }
  #levelRow strong { color:#89b4fa; font-size:16px; }

  #hint { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    color:#6c7086; font-size:13px; z-index:5; background:rgba(0,0,0,0.5);
    padding:8px 16px; border-radius:12px; pointer-events:none; }

  #levelup { position:fixed; inset:0; z-index:100; background:rgba(15,17,23,0.85);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    gap:28px; backdrop-filter:blur(4px); }
  #levelup h2 { margin:0; font-size:32px; color:#89b4fa; }
  #upgradeChoices { display:flex; gap:20px; flex-wrap:wrap; justify-content:center;
    max-width:800px; padding:0 20px; }
  .upgrade-card { background:linear-gradient(135deg,#313244,#45475a);
    border:2px solid #585b70; color:#cdd6f4; padding:22px 26px; border-radius:18px;
    font-size:15px; cursor:pointer; min-width:220px; transition:all .2s; text-align:left; }
  .upgrade-card:hover { border-color:#89b4fa; transform:translateY(-6px);
    box-shadow:0 10px 30px rgba(137,180,250,0.25); }
  .upgrade-card strong { display:block; font-size:18px; color:#89b4fa; margin-bottom:6px; }
  .upgrade-card span { color:#a6adc8; font-size:14px; }

  #gameover { position:fixed; inset:0; z-index:200; background:rgba(15,17,23,0.92);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    gap:24px; backdrop-filter:blur(4px); }
  #gameover h1 { color:#f38ba8; font-size:48px; margin:0; }
  #gameover p { font-size:20px; margin:0; }
  #gameover button { padding:14px 36px; font-size:18px; border-radius:14px;
    border:none; background:#89b4fa; color:#11111b; cursor:pointer;
    font-weight:bold; transition:transform .15s; }
  #gameover button:hover { transform:scale(1.05); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="levelRow">
    <span>Уровень: <strong id="levelText">1</strong></span>
    <span id="xpText">0 / 10</span>
  </div>
  <div class="bar"><div id="hpFill"></div><div class="bar-label" id="hpText">100 / 100</div></div>
  <div class="bar"><div id="xpFill"></div></div>
</div>

<div id="hint">WASD — двигаться · ЛКМ / Пробел — атака · Собирай ✨ и убивай врагов</div>

<div id="levelup">
  <h2>⬆ Уровень повышен!</h2>
  <div id="upgradeChoices"></div>
</div>

<div id="gameover">
  <h1>Ты пал...</h1>
  <p id="finalScore"></p>
  <button onclick="location.reload()">Играть заново</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

// ---------- МИР ----------
const WORLD = { w: 3000, h: 3000 };
const cam = { x: WORLD.w/2, y: WORLD.h/2 };

// ---------- ИГРОК ----------
const player = {
  x: WORLD.w/2, y: WORLD.h/2, r: 18,
  speed: 210, hp: 100, maxHp: 100,
  xp: 0, level: 1, xpNext: 10,
  damage: 12, attackRange: 70,
  atkCdBase: 0.4, attackCooldown: 0,
  magnet: 80, regen: 0,
};

// ---------- ВВОД ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') { tryAttack(); e.preventDefault(); }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
addEventListener('mousedown', e => { if (e.button === 0) tryAttack(); });

// ---------- СУЩНОСТИ ----------
let orbs = [], enemies = [], particles = [], decorations = [];
let attackFlash = 0, upgradeActive = false, alive = true;

for (let i = 0; i < 250; i++) {
  decorations.push({
    x: Math.random()*WORLD.w, y: Math.random()*WORLD.h,
    r: 20 + Math.random()*40,
    color: Math.random() > 0.5 ? '166,227,161' : '137,180,250'
  });
}
for (let i = 0; i < 100; i++) spawnOrb();
for (let i = 0; i < 18; i++) spawnEnemy();

function spawnOrb(x, y, val = 1) {
  orbs.push({
    x: x ?? Math.random()*WORLD.w,
    y: y ?? Math.random()*WORLD.h,
    r: 8, val, pulse: Math.random()*Math.PI*2
  });
}
function spawnEnemy() {
  let x, y, tries = 0;
  do {
    x = 100 + Math.random()*(WORLD.w-200);
    y = 100 + Math.random()*(WORLD.h-200);
    tries++;
  } while (Math.hypot(x-player.x, y-player.y) < 450 && tries < 20);
  const baseHp = 20 + player.level * 4;
  enemies.push({
    x, y, r: 14 + Math.random()*10,
    hp: baseHp, maxHp: baseHp,
    speed: 45 + Math.random()*25,
    damage: 5, attackCd: 0
  });
}
setInterval(() => { if (enemies.length < 45) spawnEnemy(); }, 1800);
setInterval(() => { if (orbs.length < 220) spawnOrb(); }, 400);

// ---------- АТАКА ----------
function tryAttack() {
  if (upgradeActive || !alive || player.attackCooldown > 0) return;
  player.attackCooldown = player.atkCdBase;
  attackFlash = 0.15;
  for (const e of enemies) {
    const dx = e.x - player.x, dy = e.y - player.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < player.attackRange + e.r) {
      e.hp -= player.damage;
      e.x += dx/d * 24; e.y += dy/d * 24;
      addParticles(e.x, e.y, '#f38ba8', 5);
    }
  }
}

function addParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, sp = 100 + Math.random()*160;
    particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.5, maxLife: 0.5, color, r: 2 + Math.random()*3
    });
  }
}

// ---------- АПГРЕЙДЫ ----------
const upgrades = [
  { name:'Живучесть',     desc:'+30 к макс. HP',           apply:()=>{ player.maxHp += 30; player.hp += 30; } },
  { name:'Скорость',      desc:'+15% к скорости',          apply:()=>{ player.speed *= 1.15; } },
  { name:'Сила удара',    desc:'+6 к урону',               apply:()=>{ player.damage += 6; } },
  { name:'Длинные руки',  desc:'+25 к радиусу атаки',      apply:()=>{ player.attackRange += 25; } },
  { name:'Магнит',        desc:'+50 к радиусу сбора',      apply:()=>{ player.magnet += 50; } },
  { name:'Регенерация',   desc:'+1.5 HP/сек',              apply:()=>{ player.regen += 1.5; } },
  { name:'Скорость атаки',desc:'-20% к перезарядке',       apply:()=>{ player.atkCdBase *= 0.8; } },
  { name:'Лекарь',        desc:'Полное лечение',           apply:()=>{ player.hp = player.maxHp; } },
];

function showUpgrades() {
  upgradeActive = true;
  const pool = [...upgrades].sort(() => Math.random() - 0.5).slice(0, 3);
  const box = document.getElementById('upgradeChoices');
  box.innerHTML = '';
  document.getElementById('levelup').style.display = 'flex';
  pool.forEach(u => {
    const b = document.createElement('button');
    b.className = 'upgrade-card';
    b.innerHTML = `<strong>${u.name}</strong><span>${u.desc}</span>`;
    b.onclick = () => {
      u.apply();
      document.getElementById('levelup').style.display = 'none';
      upgradeActive = false;
    };
    box.appendChild(b);
  });
}

// ---------- ИГРОВОЙ ЦИКЛ ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (alive) update(dt);
  render();
  updateHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt) {
  if (upgradeActive) return;

  // движение
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup'])    my -= 1;
  if (keys['s'] || keys['arrowdown'])  my += 1;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  const len = Math.hypot(mx, my);
  if (len > 0) { mx /= len; my /= len; }
  player.x += mx * player.speed * dt;
  player.y += my * player.speed * dt;
  player.x = Math.max(player.r, Math.min(WORLD.w - player.r, player.x));
  player.y = Math.max(player.r, Math.min(WORLD.h - player.r, player.y));

  // камера
  cam.x += (player.x - cam.x) * Math.min(1, dt * 8);
  cam.y += (player.y - cam.y) * Math.min(1, dt * 8);

  // реген, кулдаун, вспышка
  if (player.regen) player.hp = Math.min(player.maxHp, player.hp + player.regen * dt);
  if (player.attackCooldown > 0) player.attackCooldown -= dt;
  if (attackFlash > 0) attackFlash -= dt;

  // сферы
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    const dx = player.x - o.x, dy = player.y - o.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < player.magnet) {
      o.x += dx/d * 320 * dt; o.y += dy/d * 320 * dt;
    }
    if (d < player.r + o.r) {
      player.xp += o.val;
      addParticles(o.x, o.y, '#f9e2af', 3);
      orbs.splice(i, 1);
    }
  }

  // враги
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp <= 0) {
      addParticles(e.x, e.y, '#f38ba8', 14);
      for (let k = 0; k < 3; k++)
        spawnOrb(e.x + (Math.random()-0.5)*40, e.y + (Math.random()-0.5)*40, 2);
      enemies.splice(i, 1);
      continue;
    }
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < 550 && d > player.r + e.r - 4) {
      e.x += dx/d * e.speed * dt;
      e.y += dy/d * e.speed * dt;
    }
    if (e.attackCd > 0) e.attackCd -= dt;
    if (d < player.r + e.r && e.attackCd <= 0) {
      player.hp -= e.damage;
      e.attackCd = 1;
      addParticles(player.x, player.y, '#f38ba8', 5);
      if (player.hp <= 0) { player.hp = 0; gameOver(); return; }
    }
  }

  // частицы
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // проверка левелапа
  if (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.floor(player.xpNext * 1.4);
    showUpgrades();
  }
}

function gameOver() {
  alive = false;
  document.getElementById('finalScore').textContent = `Достигнут ${player.level} уровень`;
  document.getElementById('gameover').style.display = 'flex';
}

// ---------- ОТРИСОВКА ----------
function render() {
  ctx.fillStyle = '#0f1117';
  ctx.fillRect(0, 0, W, H);

  const ox = W/2 - cam.x, oy = H/2 - cam.y;
  const toX = x => x + ox, toY = y => y + oy;
  const onScreen = (sx, sy, m=60) => sx > -m && sx < W+m && sy > -m && sy < H+m;

  // сетка
  ctx.strokeStyle = 'rgba(255,255,255,0.035)';
  ctx.lineWidth = 1;
  const g = 80;
  for (let x = Math.floor((cam.x - W/2)/g)*g; x < cam.x + W/2; x += g) {
    const sx = toX(x); ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
  }
  for (let y = Math.floor((cam.y - H/2)/g)*g; y < cam.y + H/2; y += g) {
    const sy = toY(y); ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
  }

  // декорации (пятна «травы»)
  for (const d of decorations) {
    const sx = toX(d.x), sy = toY(d.y);
    if (!onScreen(sx, sy, d.r)) continue;
    ctx.fillStyle = `rgba(${d.color},0.06)`;
    ctx.beginPath(); ctx.arc(sx, sy, d.r, 0, Math.PI*2); ctx.fill();
  }

  // границы мира
  ctx.strokeStyle = 'rgba(137,180,250,0.35)';
  ctx.lineWidth = 4;
  ctx.strokeRect(toX(0), toY(0), WORLD.w, WORLD.h);

  // сферы
  ctx.shadowColor = '#f9e2af';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#f9e2af';
  for (const o of orbs) {
    const sx = toX(o.x), sy = toY(o.y);
    if (!onScreen(sx, sy, 20)) continue;
    o.pulse += 0.06;
    const k = 1 + Math.sin(o.pulse) * 0.25;
    ctx.beginPath(); ctx.arc(sx, sy, o.r * k, 0, Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // враги
  for (const e of enemies) {
    const sx = toX(e.x), sy = toY(e.y);
    if (!onScreen(sx, sy)) continue;
    // тело
    ctx.fillStyle = '#f38ba8';
    ctx.beginPath(); ctx.arc(sx, sy, e.r, 0, Math.PI*2); ctx.fill();
    // глаза
    ctx.fillStyle = '#11111b';
    const eo = e.r * 0.35;
    ctx.beginPath(); ctx.arc(sx - eo, sy - eo*0.6, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + eo, sy - eo*0.6, 2.5, 0, Math.PI*2); ctx.fill();
    // HP
    const hp = e.hp / e.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(sx - e.r, sy - e.r - 10, e.r*2, 4);
    ctx.fillStyle = '#a6e3a1';
    ctx.fillRect(sx - e.r, sy - e.r - 10, e.r*2*hp, 4);
  }

  // частицы
  for (const p of particles) {
    const sx = toX(p.x), sy = toY(p.y);
    if (!onScreen(sx, sy, 10)) continue;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(sx, sy, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // игрок
  const px = toX(player.x), py = toY(player.y);

  // магнит (едва заметный круг)
  ctx.strokeStyle = 'rgba(166,227,161,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(px, py, player.magnet, 0, Math.PI*2); ctx.stroke();

  // вспышка атаки
  if (attackFlash > 0) {
    ctx.fillStyle = `rgba(137,180,250,${attackFlash * 2.5})`;
    ctx.beginPath(); ctx.arc(px, py, player.attackRange, 0, Math.PI*2); ctx.fill();
  }

  // тело игрока с градиентом
  const grd = ctx.createRadialGradient(px - 6, py - 6, 3, px, py, player.r);
  grd.addColorStop(0, '#b4e8f5');
  grd.addColorStop(1, '#74c7ec');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(px, py, player.r, 0, Math.PI*2); ctx.fill();

  // глаза
  ctx.fillStyle = '#11111b';
  ctx.beginPath(); ctx.arc(px - 5, py - 3, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px + 5, py - 3, 3.2, 0, Math.PI*2); ctx.fill();

  drawMinimap(toX, toY);
}

function drawMinimap() {
  const mm = 150, pad = 16;
  const mx = W - mm - pad, my = H - mm - pad;

  ctx.fillStyle = 'rgba(17,17,27,0.8)';
  ctx.strokeStyle = 'rgba(137,180,250,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(mx, my, mm, mm, 14);
  ctx.fill(); ctx.stroke();

  const sx = mm / WORLD.w, sy = mm / WORLD.h;

  // враги
  ctx.fillStyle = 'rgba(243,139,168,0.6)';
  for (const e of enemies) {
    ctx.beginPath();
    ctx.arc(mx + e.x * sx, my + e.y * sy, 1.5, 0, Math.PI*2);
    ctx.fill();
  }
  // игрок
  ctx.fillStyle = '#89dceb';
  ctx.beginPath();
  ctx.arc(mx + player.x * sx, my + player.y * sy, 3.5, 0, Math.PI*2);
  ctx.fill();
}

// ---------- HUD ----------
const hpFill = document.getElementById('hpFill');
const hpText = document.getElementById('hpText');
const xpFill = document.getElementById('xpFill');
const xpText = document.getElementById('xpText');
const levelText = document.getElementById('levelText');

function updateHUD() {
  hpFill.style.width = (player.hp / player.maxHp * 100) + '%';
  hpText.textContent = `${Math.ceil(player.hp)} / ${player.maxHp}`;
  xpFill.style.width = (player.xp / player.xpNext * 100) + '%';
  xpText.textContent = `${player.xp} / ${player.xpNext}`;
  levelText.textContent = player.level;
}
</script>
</body>
</html>
