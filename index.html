<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Scrapper — Сборщик лома</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#050510;
    color:#e0e0ff; font-family: 'Courier New', Courier, monospace; user-select:none; }
  canvas { display:block; }

  /* HUD */
  #hud { position:fixed; top:16px; left:16px; z-index:10; pointer-events:none;
    display:flex; flex-direction:column; gap:8px; text-shadow:0 0 8px rgba(0,255,255,0.5); }
  .stat-box { background:rgba(5,10,25,0.7); border:1px solid #334;
    padding:8px 16px; border-radius:8px; backdrop-filter:blur(4px); }
  .scrap { color:#00ffff; font-size:20px; font-weight:bold; }
  .hp-bar { width:200px; height:12px; background:#300; border-radius:6px; overflow:hidden;
    border:1px solid #f38ba8; margin-top:4px; }
  #hpFill { width:100%; height:100%; background:#f38ba8; transition:width .2s; }

  /* Кнопка улучшения */
  #btnUpgrade { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    z-index:10; padding:12px 32px; font-size:18px; font-family:inherit;
    background:linear-gradient(180deg, #1e3a5f, #0f203a); color:#00ffff;
    border:2px solid #00ffff; border-radius:8px; cursor:pointer;
    box-shadow:0 0 15px rgba(0,255,255,0.3); transition:all .2s; font-weight:bold; }
  #btnUpgrade:hover { background:linear-gradient(180deg, #2a4a7f, #1a3050);
    box-shadow:0 0 25px rgba(0,255,255,0.6); transform:translateX(-50%) scale(1.05); }
  #btnUpgrade:active { transform:translateX(-50%) scale(0.95); }

  /* Меню апгрейдов */
  #upgradeMenu { position:fixed; inset:0; z-index:100; background:rgba(5,5,15,0.9);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    gap:20px; backdrop-filter:blur(6px); }
  #upgradeMenu h2 { margin:0; color:#00ffff; font-size:28px;
    text-shadow:0 0 15px rgba(0,255,255,0.6); letter-spacing:2px; }
  #upgradeMenu .scrap-info { color:#a6adc8; margin-bottom:10px; font-size:16px; }
  .upgrade-grid { display:flex; gap:20px; flex-wrap:wrap; justify-content:center;
    max-width:900px; padding:0 20px; }
  .upg-card { background:linear-gradient(135deg,#151a2e,#0a0d1a);
    border:2px solid #334; padding:20px; border-radius:12px;
    min-width:200px; cursor:pointer; transition:all .2s; text-align:center; }
  .upg-card:hover { border-color:#00ffff; box-shadow:0 0 20px rgba(0,255,255,0.3); transform:translateY(-5px); }
  .upg-card.disabled { opacity:0.4; cursor:not-allowed; border-color:#333; transform:none; box-shadow:none; }
  .upg-card strong { display:block; font-size:18px; color:#89b4fa; margin-bottom:8px; }
  .upg-card .cost { color:#00ffff; font-size:14px; margin-top:12px; font-weight:bold; }
  .upg-card .desc { color:#6c7086; font-size:12px; margin-top:6px; }
  .upg-icon { font-size:32px; margin-bottom:10px; display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="stat-box">
    <div>Скрап (Лом): <span class="scrap" id="scrapText">0</span></div>
    <div>Корпус: <span id="hpText">100/100</span></div>
    <div class="hp-bar"><div id="hpFill"></div></div>
  </div>
</div>

<button id="btnUpgrade">⚙️ ВЕРСТАК [U]</button>

<div id="upgradeMenu">
  <h2>🛠 КОСМИЧЕСКИЙ ВЕРСТАК</h2>
  <div class="scrap-info">Доступно лома: <span id="scrapInMenu" style="color:#00ffff; font-weight:bold;">0</span></div>
  <div class="upgrade-grid" id="upgradeGrid"></div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

// ---------- ИГРОК ----------
const player = {
  x: 0, y: 0, angle: -Math.PI/2, speed: 0,
  maxSpeed: 350, accel: 800, friction: 0.95,
  hp: 100, maxHp: 100,
  scrap: 0, magnetRadius: 120,
  lvlHull: 1, lvlEngine: 1, lvlMagnet: 1,
  damageFlash: 0
};

// ---------- МАССИВЫ ----------
let stars = [], junk = [], asteroids = [], particles = [], floatingTexts = [];
let keys = {};
let menuOpen = false;
let gameTime = 0;

// ---------- ВВОД ----------
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'u' || e.key === 'Escape') toggleMenu();
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
document.getElementById('btnUpgrade').onclick = toggleMenu;

// ---------- ГЕНЕРАЦИЯ КОСМОСА ----------
// Звёзды (параллакс)
for (let i = 0; i < 300; i++) {
  stars.push({
    x: Math.random()*3000 - 1500, y: Math.random()*3000 - 1500,
    z: Math.random() * 2 + 0.5, // глубина для параллакса
    size: Math.random() * 2 + 0.5
  });
}

function spawnJunk() {
  const type = Math.random() > 0.5 ? 'gear' : 'plate';
  junk.push({
    x: player.x + (Math.random()-0.5) * 1500,
    y: player.y + (Math.random()-0.5) * 1500,
    r: 8 + Math.random()*10,
    angle: Math.random()*Math.PI*2,
    spin: (Math.random()-0.5)*2,
    type, value: Math.floor(5 + Math.random()*10)
  });
}

function spawnAsteroid() {
  asteroids.push({
    x: player.x + (Math.random()-0.5) * 1200,
    y: player.y + (Math.random()-0.5) * 1200,
    r: 20 + Math.random()*30,
    vx: (Math.random()-0.5)*60,
    vy: (Math.random()-0.5)*60,
    rot: Math.random()*Math.PI*2,
    rotSpeed: (Math.random()-0.5)*1.5
  });
}

for (let i = 0; i < 60; i++) spawnJunk();
for (let i = 0; i < 10; i++) spawnAsteroid();

// Интервалы спавна
setInterval(() => { if (junk.length < 150 && !menuOpen) spawnJunk(); }, 200);
setInterval(() => { if (asteroids.length < 25 && !menuOpen) spawnAsteroid(); }, 3000);

// ---------- ЛОГИКА ИГРЫ ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (!menuOpen) { update(dt); gameTime += dt; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt) {
  // Управление
  let thrust = 0, turn = 0;
  if (keys['w'] || keys['arrowup']) thrust = 1;
  if (keys['s'] || keys['arrowdown']) thrust = -0.5;
  if (keys['a'] || keys['arrowleft']) turn = -1;
  if (keys['d'] || keys['arrowright']) turn = 1;

  player.angle += turn * 3 * dt;
  if (thrust > 0) player.speed += player.accel * thrust * dt;
  else if (thrust < 0) player.speed += player.accel * thrust * dt;
  else player.speed *= Math.pow(player.friction, dt * 60);

  player.speed = Math.max(-player.maxSpeed*0.5, Math.min(player.maxSpeed, player.speed));

  // Движение
  player.x += Math.cos(player.angle) * player.speed * dt;
  player.y += Math.sin(player.angle) * player.speed * dt;

  // Частицы двигателя
  if (thrust > 0 && Math.random() < 0.8) {
    const spread = (Math.random()-0.5)*0.4;
    particles.push({
      x: player.x - Math.cos(player.angle+spread)*15,
      y: player.y - Math.sin(player.angle+spread)*15,
      vx: -Math.cos(player.angle)*100 + (Math.random()-0.5)*50,
      vy: -Math.sin(player.angle)*100 + (Math.random()-0.5)*50,
      life: 0.4, maxLife: 0.4, color: '#00ffff', r: 3
    });
  }

  // Сбор лома (магнит)
  for (let i = junk.length - 1; i >= 0; i--) {
    const j = junk[i];
    j.angle += j.spin * dt;
    const dx = player.x - j.x, dy = player.y - j.y;
    const dist = Math.hypot(dx, dy);

    // Притягивание
    if (dist < player.magnetRadius) {
      const force = (1 - dist / player.magnetRadius) * 600;
      j.x += (dx / dist) * force * dt;
      j.y += (dy / dist) * force * dt;
    }

    // Сбор
    if (dist < 25) {
      player.scrap += j.value;
      addFloatingText(j.x, j.y, `+${j.value}`, '#00ffff');
      addParticles(j.x, j.y, '#00ffff', 8);
      junk.splice(i, 1);
      updateHUD();
    }
  }

  // Астероиды
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.rot += a.rotSpeed * dt;

    // Коллизия с игроком
    const dx = player.x - a.x, dy = player.y - a.y;
    const dist = Math.hypot(dx, dy);
    if (dist < a.r + 18) {
      // Отскок
      const angle = Math.atan2(dy, dx);
      player.x += Math.cos(angle) * (a.r + 18 - dist);
      player.y += Math.sin(angle) * (a.r + 18 - dist);
      player.speed *= 0.5;
      
      if (player.damageFlash <= 0) {
        player.hp -= 15;
        player.damageFlash = 0.5;
        addParticles(player.x, player.y, '#f38ba8', 15);
        updateHUD();
        if (player.hp <= 0) respawn();
      }
    }

    // Удаление далёких астероидов
    if (Math.hypot(player.x - a.x, player.y - a.y) > 2500) {
      asteroids.splice(i, 1);
    }
  }

  if (player.damageFlash > 0) player.damageFlash -= dt;

  // Обновление частиц
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Обновление всплывающего текста
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y -= 40 * dt;
    t.life -= dt;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

function respawn() {
  player.hp = player.maxHp;
  player.x = 0; player.y = 0; player.speed = 0;
  player.scrap = Math.floor(player.scrap * 0.8); // Штраф 20% лома
  updateHUD();
  addParticles(0, 0, '#f38ba8', 40);
}

function addParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, sp = 50 + Math.random()*200;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.5+Math.random()*0.5, maxLife: 1, color, r: 1+Math.random()*3 });
  }
}

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 1 });
}

// ---------- ОТРИСОВКА ----------
function render() {
  // Фон
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  const cx = W/2 - player.x;
  const cy = H/2 - player.y;

  // Звёзды с параллаксом
  for (const s of stars) {
    const sx = W/2 + (s.x - player.x * s.z * 0.2);
    const sy = H/2 + (s.y - player.y * s.z * 0.2);
    // Зацикливание звёзд
    const px = ((sx + 1500) % 3000 + 3000) % 3000 - 1500;
    const py = ((sy + 1500) % 3000 + 3000) % 3000 - 1500;
    if (px > -W/2 && px < W/2 && py > -H/2 && py < H/2) {
      ctx.fillStyle = `rgba(255,255,255,${0.3 + s.z*0.3})`;
      ctx.beginPath(); ctx.arc(W/2 + px, H/2 + py, s.size, 0, Math.PI*2); ctx.fill();
    }
  }

  // Радиус магнита (едва заметный)
  ctx.strokeStyle = 'rgba(0,255,255,0.05)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W/2, H/2, player.magnetRadius, 0, Math.PI*2); ctx.stroke();

  // Космический мусор
  for (const j of junk) {
    const sx = j.x + cx, sy = j.y + cy;
    if (sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
    
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(j.angle);
    ctx.fillStyle = '#8899aa';
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 1;
    
    if (j.type === 'gear') {
      // Шестерёнка
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2;
        const r1 = j.r, r2 = j.r * 1.3;
        ctx.lineTo(Math.cos(a)*r1, Math.sin(a)*r1);
        ctx.lineTo(Math.cos(a+0.2)*r2, Math.sin(a+0.2)*r2);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#050510'; ctx.beginPath(); ctx.arc(0,0,j.r*0.4,0,Math.PI*2); ctx.fill();
    } else {
      // Пластина
      ctx.fillRect(-j.r, -j.r*0.6, j.r*2, j.r*1.2);
      ctx.strokeRect(-j.r, -j.r*0.6, j.r*2, j.r*1.2);
      ctx.fillStyle = '#00ffff';
      ctx.fillRect(-j.r+3, -j.r*0.6+3, 4, 4);
      ctx.fillRect(j.r-7, j.r*0.6-7, 4, 4);
    }
    ctx.restore();
  }

  // Астероиды
  for (const a of asteroids) {
    const sx = a.x + cx, sy = a.y + cy;
    if (sx < -100 || sx > W+100 || sy < -100 || sy > H+100) continue;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(a.rot);
    ctx.fillStyle = '#2a2a3a';
    ctx.strokeStyle = '#444455';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let k = 0; k < 7; k++) {
      const angle = (k / 7) * Math.PI * 2;
      const rad = a.r * (0.8 + Math.sin(angle*3)*0.2);
      if (k === 0) ctx.moveTo(Math.cos(angle)*rad, Math.sin(angle)*rad);
      else ctx.lineTo(Math.cos(angle)*rad, Math.sin(angle)*rad);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Частицы
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x + cx, p.y + cy, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Всплывающий текст
  for (const t of floatingTexts) {
    ctx.globalAlpha = Math.max(0, t.life);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 16px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x + cx, t.y + cy);
  }
  ctx.globalAlpha = 1;

  // ИГРОК (Корабль)
  drawShip(W/2, H/2, player.angle);

  // Мигание при уроне
  if (player.damageFlash > 0 && Math.floor(player.damageFlash * 10) % 2 === 0) {
    ctx.fillStyle = 'rgba(243,139,168,0.2)';
    ctx.fillRect(0,0,W,H);
  }

  // Радар (мини-карта)
  drawRadar();
}

function drawShip(x, y, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  const lvl = player.lvlHull;
  const eng = player.lvlEngine;
  
  // Цвета
  const hullColor = '#1e3a5f';
  const accentColor = '#00ffff';
  
  ctx.shadowColor = accentColor;
  ctx.shadowBlur = 10;

  // --- КОРПУС (Центр) ---
  ctx.fillStyle = hullColor;
  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 2;
  
  // Основной блок (прямоугольник со скруглением)
  ctx.beginPath();
  ctx.roundRect(-15, -20, 30, 40, 8);
  ctx.fill(); ctx.stroke();

  // Кабина
  ctx.fillStyle = '#74c7ec';
  ctx.beginPath();
  ctx.arc(0, -5, 6, 0, Math.PI*2);
  ctx.fill();

  // --- КРЫЛЬЯ (Улучшение 2) ---
  if (lvl >= 2) {
    ctx.fillStyle = '#2a2a3a';
    // Левое крыло
    ctx.beginPath();
    ctx.moveTo(-15, -10);
    ctx.lineTo(-40, -20);
    ctx.lineTo(-40, 10);
    ctx.lineTo(-15, 15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Правое крыло
    ctx.beginPath();
    ctx.moveTo(15, -10);
    ctx.lineTo(40, -20);
    ctx.lineTo(40, 10);
    ctx.lineTo(15, 15);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Пушки на крыльях
    ctx.fillStyle = accentColor;
    ctx.fillRect(-38, -8, 4, 12);
    ctx.fillRect(34, -8, 4, 12);
  }

  // --- НОСОВЫЕ АНТЕННЫ / УСИКИ (Улучшение 3) ---
  if (lvl >= 3) {
    ctx.strokeStyle = '#f9e2af';
    ctx.lineWidth = 2;
    // Левый ус
    ctx.beginPath();
    ctx.moveTo(-8, -20);
    ctx.lineTo(-15, -35);
    ctx.lineTo(-8, -40);
    ctx.stroke();
    // Правый ус
    ctx.beginPath();
    ctx.moveTo(8, -20);
    ctx.lineTo(15, -35);
    ctx.lineTo(8, -40);
    ctx.stroke();
    
    // Сенсоры на усах
    ctx.fillStyle = '#f38ba8';
    ctx.beginPath(); ctx.arc(-8, -40, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -40, 3, 0, Math.PI*2); ctx.fill();
  }

  // --- ДВИГАТЕЛИ (Зависят от lvlEngine) ---
  const engCount = Math.min(3, eng);
  for (let i = 0; i < engCount; i++) {
    const ex = -10 + i * 10;
    ctx.fillStyle = '#111';
    ctx.fillRect(ex - 3, 20, 6, 8);
    ctx.fillStyle = accentColor;
    ctx.fillRect(ex - 2, 28, 4, 4);
  }

  ctx.restore();
}

function drawRadar() {
  const rw = 150, rh = 150, pad = 20;
  const rx = W - rw - pad, ry = H - rh - pad;

  ctx.fillStyle = 'rgba(5,10,25,0.8)';
  ctx.strokeStyle = 'rgba(0,255,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(rx + rw/2, ry + rh/2, rw/2, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  const scale = rw / 2000; // 2000 единиц мира
  const rcx = rx + rw/2, rcy = ry + rh/2;

  // Мусор
  ctx.fillStyle = '#00ffff';
  for (const j of junk) {
    const dx = (j.x - player.x) * scale, dy = (j.y - player.y) * scale;
    if (Math.hypot(dx, dy) < rw/2) {
      ctx.beginPath(); ctx.arc(rcx + dx, rcy + dy, 1.5, 0, Math.PI*2); ctx.fill();
    }
  }
  // Астероиды
  ctx.fillStyle = '#f38ba8';
  for (const a of asteroids) {
    const dx = (a.x - player.x) * scale, dy = (a.y - player.y) * scale;
    if (Math.hypot(dx, dy) < rw/2) {
      ctx.beginPath(); ctx.arc(rcx + dx, rcy + dy, 2.5, 0, Math.PI*2); ctx.fill();
    }
  }
  // Игрок
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(rcx, rcy, 3, 0, Math.PI*2); ctx.fill();
}

// ---------- UI И УЛУЧШЕНИЯ ----------
const scrapText = document.getElementById('scrapText');
const hpText = document.getElementById('hpText');
const hpFill = document.getElementById('hpFill');

function updateHUD() {
  scrapText.textContent = player.scrap;
  hpText.textContent = `${Math.ceil(player.hp)}/${player.maxHp}`;
  hpFill.style.width = (player.hp / player.maxHp * 100) + '%';
}

// Конфигурация апгрейдов
const upgrades = [
  { id: 'hull', name: 'Корпус', icon: '🛡️', desc: 'Увеличивает макс. HP и визуал',
    cost: () => 50 + player.lvlHull * 100,
    maxLvl: 3,
    apply: () => { player.lvlHull++; player.maxHp += 50; player.hp = player.maxHp; } },
  { id: 'engine', name: 'Двигатели', icon: '🚀', desc: 'Увеличивает скорость и ускорение',
    cost: () => 40 + player.lvlEngine * 80,
    maxLvl: 3,
    apply: () => { player.lvlEngine++; player.maxSpeed += 100; player.accel += 200; } },
  { id: 'magnet', name: 'Магнит', icon: '🧲', desc: 'Увеличивает радиус сбора',
    cost: () => 60 + player.lvlMagnet * 120,
    maxLvl: 5,
    apply: () => { player.lvlMagnet++; player.magnetRadius += 60; } },
];

function toggleMenu() {
  menuOpen = !menuOpen;
  const menu = document.getElementById('upgradeMenu');
  if (menuOpen) {
    menu.style.display = 'flex';
    renderUpgrades();
  } else {
    menu.style.display = 'none';
  }
}

function renderUpgrades() {
  document.getElementById('scrapInMenu').textContent = player.scrap;
  const grid = document.getElementById('upgradeGrid');
  grid.innerHTML = '';

  upgrades.forEach(u => {
    const lvl = u.id === 'hull' ? player.lvlHull : u.id === 'engine' ? player.lvlEngine : player.lvlMagnet;
    const cost = u.cost();
    const isMax = lvl >= u.maxLvl;
    const canAfford = player.scrap >= cost;

    const card = document.createElement('div');
    card.className = 'upg-card' + (!canAfford || isMax ? ' disabled' : '');
    
    card.innerHTML = `
      <span class="upg-icon">${u.icon}</span>
      <strong>${u.name} (Ур. ${lvl}/${u.maxLvl})</strong>
      <div class="desc">${u.desc}</div>
      <div class="cost">${isMax ? 'МАКС. УРОВЕНЬ' : 'Стоимость: ' + cost}</div>
    `;

    if (canAfford && !isMax) {
      card.onclick = () => {
        player.scrap -= cost;
        u.apply();
        updateHUD();
        renderUpgrades(); // Перерисовать меню
        addParticles(player.x, player.y, '#00ffff', 30);
      };
    }
    grid.appendChild(card);
  });
}

// Запуск
updateHUD();
</script>
</body>
</html>
